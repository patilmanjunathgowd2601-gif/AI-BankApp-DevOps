apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ai-bankapp
spec:
  # Paused (0) by default: on a resource-constrained local dev cluster,
  # running the full monitoring stack alongside all app tiers causes real
  # CPU/memory contention and crash-looping. Scale to 1 when you specifically
  # want to demo monitoring: `kubectl scale deployment prometheus -n
  # ai-bankapp --replicas=1` (consider scaling ai-service/frontend to 0 or 1
  # first to make room). On a cluster with real headroom, just set this
  # back to 1 permanently.
  replicas: 0
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ai-bankapp
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
