apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-bankapp
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-secret, key: admin-password }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-bankapp
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: ai-bankapp
type: Opaque
stringData:
  admin-password: admin
