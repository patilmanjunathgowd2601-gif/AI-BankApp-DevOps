apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-bankapp
spec:
  # Paused (0) by default -- see the matching comment in
  # prometheus-deployment.yaml for why, and how to re-enable.
  replicas: 0
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      # Pinning the numeric UID explicitly rather than trusting the image's
      # declared default -- see the matching comment in
      # k8s/postgres/statefulset.yaml for why this is necessary for
      # runAsNonRoot: true to work at all with some official images.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          securityContext:
            allowPrivilegeEscalation: false
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-secret, key: admin-password }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-bankapp
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: ai-bankapp
type: Opaque
stringData:
  admin-password: admin
