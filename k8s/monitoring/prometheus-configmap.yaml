apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ai-bankapp
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'ai-bankapp-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['backend:8080']
      - job_name: 'ai-fraud-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['ai-service:8000']
