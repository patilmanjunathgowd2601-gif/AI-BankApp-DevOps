apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-bankapp
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
          # Locally-built image loaded into the kind cluster via
          # `kind load docker-image`. In the real CI/CD pipeline this would
          # instead point at ghcr.io/<owner>/ai-bankapp-backend:998be0e75ed34a8573545c029bd617db96361130
          # automatically by cd-gitops.yml after each successful build.
          image: ai-bankapp-devops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret }
          # A cold Spring Boot start on modest hardware has been observed
          # taking 60-100+ seconds in this project (JPA repo scanning,
          # Hibernate bootstrap, HikariCP connecting, etc.). The old
          # liveness probe (initialDelaySeconds: 40, periodSeconds: 20,
          # default failureThreshold: 3) started killing the container
          # around the 80s mark -- before it ever finished starting up,
          # producing a permanent crash loop unrelated to actual load.
          # startupProbe holds off readiness/liveness evaluation until the
          # app answers once, with a much longer overall budget
          # (30 * 10s = up to 300s) for that first success.
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 1, memory: 768Mi }
