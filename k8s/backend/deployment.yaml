apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-bankapp
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Locally-built image loaded into the kind cluster via
          # `kind load docker-image`. In the real CI/CD pipeline this would
          # instead point at ghcr.io/<owner>/ai-bankapp-backend:<sha>, bumped
          # automatically by cd-gitops.yml after each successful build.
          image: ai-bankapp-devops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 1, memory: 768Mi }
