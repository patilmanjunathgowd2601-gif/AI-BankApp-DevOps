apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-bankapp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The official postgres image actually declares ROOT as its default
      # user -- it only drops to the unprivileged "postgres" user (fixed at
      # UID/GID 999 in every official variant, specifically so this is
      # predictable) internally via its entrypoint script after doing
      # root-only setup. Kubernetes' runAsNonRoot check reads the image's
      # declared default user before the entrypoint ever runs, so without an
      # explicit runAsUser here it sees "root" and refuses to start the
      # container at all ("image will run as root"). fsGroup makes sure the
      # mounted PVC is group-writable by that same GID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
