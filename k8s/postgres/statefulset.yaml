apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-bankapp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The official postgres image actually declares ROOT as its default
      # user -- it only drops to the unprivileged "postgres" user (fixed at
      # UID/GID 999 in every official variant, specifically so this is
      # predictable) internally via its entrypoint script after doing
      # root-only setup. Kubernetes' runAsNonRoot check reads the image's
      # declared default user before the entrypoint ever runs, so without an
      # explicit runAsUser here it sees "root" and refuses to start the
      # container at all ("image will run as root"). fsGroup makes sure the
      # mounted PVC is group-writable by that same GID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      # fsGroup above only changes the volume's GROUP ownership; kind's
      # default storage provisioner creates the underlying hostPath directory
      # owned by root, and initdb needs to chmod/chown that directory itself
      # -- an operation only the OWNER (or root) can do, regardless of the
      # permission bits fsGroup sets. This one-shot init container runs as
      # root (overriding the pod-level runAsNonRoot just for itself) purely
      # to hand ownership to the postgres UID before the real container ever
      # starts, so postgres itself still never runs as root.
      initContainers:
        - name: fix-data-dir-ownership
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
