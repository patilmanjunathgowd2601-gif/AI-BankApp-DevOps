apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-bankapp
  labels:
    app: frontend
spec:
  # 1 replica to fit comfortably on resource-constrained local dev clusters;
  # bump to 2+ on a cluster with real headroom.
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Belt-and-suspenders with the container-level settings below: even if
      # the image were somehow misconfigured, the kubelet refuses to run any
      # container in this pod as UID 0.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          # See backend/deployment.yaml for why this uses the local
          # docker-compose image name instead of the ghcr.io production path.
          image: ai-bankapp-devops-frontend:latest
          imagePullPolicy: IfNotPresent
          # nginx-unprivileged listens on 8080, not the usual 80 -- it can't
          # bind < 1024 without root, which is exactly what runAsNonRoot
          # above prevents.
          ports:
            - containerPort: 8080
          env:
            # Must be empty: the React app's api client does
            # `baseURL + '/api/auth/login'` (the '/api/' prefix is already
            # hardcoded in the component calls). Setting this to "/api" here
            # produced a doubled "/api/api/auth/login" path that neither the
            # ingress nor Spring's permitAll rule matched, surfacing as a
            # confusing empty-body 403. Leaving it blank makes requests
            # resolve relative to the current origin, which the ingress
            # then correctly routes to the backend Service.
            - name: API_BASE_URL
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
