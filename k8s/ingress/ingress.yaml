apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-bankapp-ingress
  namespace: ai-bankapp
  annotations:
spec:
  ingressClassName: nginx
  rules:
    - host: ai-bankapp.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
