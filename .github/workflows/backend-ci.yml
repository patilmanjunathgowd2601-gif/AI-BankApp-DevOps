name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**']

# This repo's default GITHUB_TOKEN workflow permission is read-only (repo
# Settings > Actions > General), so pushing a new GHCR package fails with
# "denied: installation not allowed to Create organization package" unless a
# workflow explicitly requests write access here.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-bankapp-backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B clean verify

      - name: Build jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

  dependency-check:
    needs: build-test
    runs-on: ubuntu-latest
    # Deliberately its own job, not a step tacked onto build-test: this is a
    # Docker container action that bundles its own JDK, but actions/setup-java
    # in build-test exports JAVA_HOME (via $GITHUB_ENV) pointing at the
    # *runner's* JDK path. Because GitHub Actions always forwards any in-scope
    # env var to a container action via `docker run -e VARNAME` (using
    # whatever value -- including an explicit empty string -- is currently
    # set), that JAVA_HOME silently overrides the image's own correct
    # built-in default rather than being ignored, breaking the container's
    # own java lookup either way ("JAVA_HOME is not defined correctly").
    # A separate job gets a clean environment with no such export, so the
    # container just uses its own bundled JDK with no override needed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: OWASP Dependency-Check
        # Pinned to a full commit SHA, not @main or even a version tag:
        # Semgrep's CI supply-chain rule flags ANY mutable reference (tags
        # included, not just branches) since even release tags can be
        # force-moved by the publisher -- the same class of risk behind real
        # supply-chain incidents against trivy-action and kics-action.
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'ai-bankapp-backend'
          path: 'backend'
          format: 'HTML'
          args: >
            --failOnCVSS 9
            --enableRetired

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report-backend
          path: reports

  build-image:
    needs: [build-test, dependency-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy container image scan
        # Pinned to a full commit SHA, not just a version tag -- see the
        # Dependency-Check comment above for why.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only after Trivy scan passes)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
