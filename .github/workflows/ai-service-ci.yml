name: AI Service CI

on:
  push:
    branches: [main]
    paths: ['ai-service/**', '.github/workflows/ai-service-ci.yml']
  pull_request:
    paths: ['ai-service/**']

# This repo's default GITHUB_TOKEN workflow permission is read-only (repo
# Settings > Actions > General), so pushing a new GHCR package fails with
# "denied: installation not allowed to Create organization package" unless a
# workflow explicitly requests write access here.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-bankapp-ai-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train model
        working-directory: ai-service
        run: python app/train_model.py

      - name: Run tests
        working-directory: ai-service
        run: pytest tests/ -v

      - name: pip-audit (dependency vulnerability check)
        working-directory: ai-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  build-image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ai-service
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy container image scan
        # Pinned to a full commit SHA, not just a version tag -- see the same
        # comment in frontend-ci.yml for why.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only after Trivy scan passes)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ai-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
