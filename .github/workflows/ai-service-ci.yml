name: AI Service CI

on:
  push:
    branches: [main]
    paths: ['ai-service/**', '.github/workflows/ai-service-ci.yml']
  pull_request:
    paths: ['ai-service/**']

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-bankapp-ai-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train model
        working-directory: ai-service
        run: python app/train_model.py

      - name: Run tests
        working-directory: ai-service
        run: pytest tests/ -v

      - name: pip-audit (dependency vulnerability check)
        working-directory: ai-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  build-image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only after Trivy scan passes)
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
