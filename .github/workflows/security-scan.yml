name: Security Scans (Secrets + SAST)

# Repo-wide DevSecOps gate: runs on every push/PR regardless of which
# service changed, since secret leaks and insecure code patterns aren't
# scoped to a single service. Complements the per-service CI workflows
# (backend-ci.yml / frontend-ci.yml / ai-service-ci.yml), which each run
# OWASP Dependency-Check or npm audit / pip-audit plus a Trivy image scan.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Pinned to a full commit SHA -- see the matching comment in
        # backend-ci.yml for why (Semgrep's supply-chain rule flags any
        # mutable reference, tags included, not just branches).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        run: semgrep scan --config auto --error --exclude ai-service/venv --exclude frontend/node_modules

  zap-dast:
    name: OWASP ZAP dynamic scan (DAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Boot the full stack via Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the frontend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 5
          done
          echo "Frontend never became healthy" >&2
          docker compose logs
          exit 1

      - name: Run ZAP baseline scan against the running app
        # Pinned to a full commit SHA -- see the matching comment in
        # backend-ci.yml for why.
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          cmd_options: '-a'
          # Without this, the action tries to file scan results as a GitHub
          # issue, which needs `issues: write` permission our default
          # GITHUB_TOKEN doesn't have -- failing with "Resource not
          # accessible by integration" regardless of what ZAP actually found.
          # The HTML/MD report artifact is enough for this pipeline.
          allow_issue_writing: false

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
